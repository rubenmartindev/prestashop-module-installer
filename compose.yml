services:
  db:
    image: mysql:${DB_VERSION_TAG:-5.7}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-prestashop}
      MYSQL_USER: ${DB_USER:-prestashop}
      MYSQL_PASSWORD: ${DB_PASSWORD:-prestashop}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  prestashop:
    build:
      context: .
      dockerfile: .docker/prestashop/Dockerfile
      args:
        PS_VERSION_TAG: ${PS_VERSION_TAG:-9}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME:-prestashop}
      DB_USER: ${DB_USER:-prestashop}
      DB_PASSWD: ${DB_PASSWORD:-prestashop}
      PS_DEV_MODE: ${PS_DEV_MODE:-1}
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO:-1}
      PS_DOMAIN: ${PS_DOMAIN:-localhost}
      ADMIN_MAIL: ${PS_ADMIN_MAIL:-admin@example.com}
      ADMIN_PASSWD: ${PS_ADMIN_PASSWD:-admin@example.com}
      XDEBUG_CONFIG: client_host=host.docker.internal
    ports:
      - "${PS_HTTP_PORT:-80}:80"
    volumes:
      - ./prestashop/${PS_VERSION_TAG:-9}:/var/www/html
      - .:/workspace/prestashop-module-installer
      - ./.docker/prestashop/module:/var/www/html/modules/installerdemo

volumes:
  database:
